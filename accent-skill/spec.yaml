- use: B4
  title: "Корзина 01: Трансформация и миссия"
  thesis: "Три перехода, миссия на десять лет, восемь функций, распределение ответственности."
  rel: перечень
  text:
    text1: "TNF добавляет к форуму постоянную отраслевую работу и управление клиентами."
    text2: "Миссия: соединять государство, заказчиков, производителей, науку для ускорения решений."
    text3: "Восемь функций: TNF — организатор взаимодействия, не замена государству."
    text4: "2027 — устойчивость и первые запуски; 2030 — жизнеспособность круглогодичной модели."
- use: B4
  title: "Корзина 02: Клиентские потребности"
  thesis: "Четыре сегмента, три инициативы, гэпы по шкале 0–10."
  rel: перечень
  text:
    text1: "ВИНК: самый большой разрыв — международный опыт и инженерная повестка."
    text2: "Производители: не хватает профильных покупателей и доступа к конкретным людям."
    text3: "Нефтесервис: высокие оценки встречам, низкие — сохранению материалов."
    text4: "Власть: главный недостаток — кооперация между странами, регионами, отраслями."
- use: B4
  title: "Корзина 03: Инициативы команд"
  thesis: "Три направления из девяти исходных инициатив."
  rel: перечень
  text:
    text1: "Кооперация: международная, межотраслевая, межрегиональная — предметные контакты."
    text2: "Технологический спрос: темы форума от реальных запросов заказчиков, не инерции."
    text3: "Сервисное сопровождение: 51 клиент, исследование задач, персональная программа."
    text4: "Все исходные инициативы сохранены; укрупнение — для управления, не замена."
- use: B4
  title: "Корзина 04: События и форматы"
