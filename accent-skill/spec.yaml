  title: "ТНФ: трансформация и план развития"
  text:
    label1: "Итоги стратегической сессии"
    meta1: "20–22 ноября 2026"
- use: A3
  title: "01. Трансформация и миссия"
  text:
    label1: "ТНФ: трансформация и план развития"
- use: C13
  title: "Три перехода + Три представления о новой роли TNF"
  thesis: "TNF не отказывается от сильного ежегодного форума. Он добавляет к нему постоянную отраслевую работу, предметную полезность и управление отношениями с клиентами."
  rel: контраст
  table:
    header: ["Каким был", "Каким должен стать"]
    rows:
      - ["Событие", "Платформа"]
      - ["Разовый", "Круглогодичный"]
      - ["Статусный", "Предметный"]
- use: B2
  title: "Почему TNF необходимо пересобрать именно сейчас"
  thesis: "Причины трансформации одновременно отраслевые, клиентские и экономические."
  rel: обоснование
  text:
    label1: "Отраслевой запрос"
    text1: "Государству, ВИНК, производителям нужен механизм кооперации за пределами одного события."
    label2: "Стратегический актив"
    text2: "Форум объединяет лидеров отрасли и обладает доверием, которое можно превратить в регулярную работу."
    label3: "Клиентский запрос"
    text3: "Не хватает профильных заказчиков, конкретных технологических решений и сопровождаемых встреч."
    label4: "Коммерческий вызов"
    text4: "Сокращение дорогих бейджей при росте общей/бесплатной аудитории."
- use: B2
  title: "Миссия TNF на десять лет"
  thesis: "Соединять государство, заказчиков, производителей, научные сообщества для ускорения решений."
  rel: фокус
  text:
    label1: "Обещание отрасли"
    text1: "Превращать общие вызовы в кооперационные проекты и проверяемые результаты."
    label2: "Обещание клиенту"
    text2: "Давать доступ к нужным людям, содержанию и возможностям после форума."
    label3: "Обещание партнёрам"
    text3: "Предоставлять нейтральную инфраструктуру без замены полномочий."
    label4: "Два горизонта"
    text4: "2027 — коммерческая устойчивость и первые запуски; 2030 — доказать жизнеспособность круглогодичной модели."
- use: B4
  title: "2027 → 2030 → десять лет + Два контура ценности"
  thesis: "Без сцены нет аудитории, без аудитории нет сцены."
  rel: контраст
  text:
    text1: "2027: сохранить финансовую устойчивость форума и запустить первые направления."
    text2: "2030: проверить жизнеспособность круглогодичной модели."
    text3: "Статусный контур: отраслевая повестка, государство, ВИНК."
    text4: "Профессиональный контур: платящая аудитория, производители, нефтесервис."
- use: C13
  title: "Восемь функций TNF + Распределение ответственности"
  thesis: "TNF — организатор взаимодействия, а не замена государству или институту."
  rel: структура
  table:
    header: ["Функция", "Кто отвечает"]
    rows:
      - ["Координация", "TNF"]
      - ["Государственное решение", "Органы власти"]
      - ["Технологический запрос", "ВИНК"]
      - ["Коммерческое предложение", "Производители"]
- use: A3
  title: "02. Клиентские потребности и гэпы"
  text:
    label1: "ТНФ: трансформация и план развития"
- use: B4
  title: "От четырёх сегментов к трём инициативам"
  thesis: "Четыре команды сопоставили потребности и выбрали ограниченное число проблем для первых 100 дней."
  rel: фокус
  text:
    text1: "Сегменты: ВИНК, производители, нефтесервис, органы власти."
    text2: "Шкала 0–10 — субъективные оценки участников, не репрезентативные интервью."
    text3: "Гэп = 10 минус оценка; только для визуального ранжирования."
    text4: "Повторяющиеся потребности: реальный заказчик, технологическая кооперация, измеримый результат."
- use: C13
  title: "ВИНК: приоритет по величине разрыва"
  thesis: "Самый большой разрыв — международный опыт и прикладная инженерная повестка."
  rel: реестр
  table:
    header: ["Потребность", "Оценка", "Гэп"]
    rows:
      - ["Международный опыт", "2/10", "8"]
      - ["Инженерная повестка", "3/10", "7"]
      - ["Закрытые заказчики", "4/10", "6"]
- use: B4
  title: "Производители + Нефтесервис: главные разрывы"
  thesis: "Производителям не хватает профильных покупателей; нефтесервису — сохранение результатов после форума."
  rel: сравнение
  text:
    text1: "Производители: доступ к конкретным людям важнее, чем сама возможность выставить продукт."
    text2: "Нефтесервис: высокие оценки встречам, но низкие — сохранению материалов и связке с наукой."
- use: B4
  title: "Власть + Повторяющиеся проблемы"
  thesis: "Группа власти выделила четыре задачи; самым недоработанным назвала кооперацию между странами, регионами и отраслями."
  rel: обоснование
  text:
    text1: "Власть: международная, межотраслевая, межрегиональная кооперация, технологические стандарты."
    text2: "Несколько групп указали на один системный вопрос: как привести нужных людей к нужной задаче."
    text3: "Оценки 0–10 относились к разным формулировкам — сопоставление тематическое, не единый индекс."
    text4: "Повторяющиеся потребности: заказчик, специалист, кооперация, формат, результат."
- use: A3
  title: "03. Инициативы команд"
  text:
    label1: "ТНФ: трансформация и план развития"
- use: B4
  title: "Девять исходных инициатив и три итоговых направления"
  thesis: "9 отдельных инициатив укрупнены в три направления; исходные предложения сохранены."
  rel: иерархия
  text:
    text1: "Власть: 3 инициативы (международная, межотраслевая, межрегиональная кооперация)."
    text2: "ВИНК: 3 инициативы (международный трек, технологические запросы, развитие EXPO)."
    text3: "Производители: 1 инициатива (фокусные рыночные ниши)."
    text4: "Нефтесервис: 2 инициативы (сопровождение 51 клиента, новые форматы программы)."
- use: B2
  title: "Инициатива I · Кооперация"
  thesis: "Перевести статус TNF в предметные международные, межрегиональные и межотраслевые контакты."
  rel: цепочка
  text:
    label1: "Зачем"
    text1: "Участникам нужны не флаги, а конкретные договорённости и продолжение работы после форума."
    label2: "Что"
    text2: "Международные делегации, межотраслевые рабочие группы, региональные партнёрства."
    label3: "Кто"
    text3: "Государственные каналы + TNF как нейтральная инфраструктура."
    label4: "Результат"
    text4: "Рост числа содержательных контактов и кооперационных проектов."
- use: B2
  title: "Инициатива II · Технологический спрос"
  thesis: "Выбирать темы и форматы TNF, опираясь на настоящие запросы заказчиков."
  rel: цепочка
  text:
    label1: "Зачем"
    text1: "Перестать угадывать потребности — заранее получать технологические задачи и подбирать решения."
    label2: "Что"
    text2: "Фокусные ниши, рыночный фильтр, проверка готовности инвестировать."
    label3: "Кто"
    text3: "ВИНК как заказчик + производители как исполнители + TNF как площадка."
    label4: "Результат"
    text4: "Программа форума отражает реальный спрос, а не инерцию прошлых лет."
- use: B2
  title: "Инициатива III · Сервисное сопровождение"
  thesis: "Улучшить результативность участия ключевых корпоративных клиентов и их возвращаемость."
  rel: цепочка
  text:
    label1: "Зачем"
    text1: "Собирать ценность не только в дни форума, но и между событиями."
    label2: "Что"
    text2: "Сопровождение 51 клиента, исследование задач, персональная программа."
    label3: "Кто"
    text3: "Команда TNF + ключевые корпоративные клиенты."
    label4: "Результат"
    text4: "Повышение удовлетворённости и возвращаемости платящих участников."
- use: C13
  title: "Первоисточники: 6 инициатив Власти и ВИНК"
  thesis: "Каждую исходную инициативу важно показать отдельно: разные первые шаги, ресурсы и результаты."
  rel: реестр
  table:
    header: ["Инициатива", "Суть", "Первые шаги"]
    rows:
      - ["Власть-01", "Международная кооперация", "Государственные каналы для делегаций"]
      - ["Власть-02", "Межотраслевая кооперация", "Рабочие форматы по запросам промышленности"]
      - ["Власть-03", "Межрегиональная кооперация", "Сеть региональных партнёров"]
      - ["ВИНК-04", "Международный трек", "Рыночный фильтр: страны нужны стейкхолдерам"]
- use: C13
  title: "Первоисточники: 3 инициативы Производителей и Нефтесервиса"
  thesis: "Более определённый предмет и собственная логика первых 100 дней."
  rel: реестр
  table:
    header: ["Инициатива", "Суть", "Первые шаги"]
    rows:
      - ["Производители-07", "Фокусные рыночные ниши", "Темы на пересечении спроса и предложения"]
      - ["Нефтесервис-08", "Сопровождение 51 клиента", "Исследование задач постоянных клиентов"]
      - ["Нефтесервис-09", "Новые форматы программы", "Пересборка по посещаемости и обратной связи"]
- use: A3
  title: "04. События и форматы"
  text:
    label1: "ТНФ: трансформация и план развития"
- use: C13
  title: "Оригиналы Власти: три направления кооперации"
  thesis: "Международная, межотраслевая, межрегиональная — три механики, разные целевые результаты."
  rel: реестр
  table:
    header: ["Направление", "Механика", "Результат"]
    rows:
      - ["Международная", "Государственные каналы", "Содержательные иностранные делегации"]
      - ["Межотраслевая", "Рабочие форматы", "Запуск по запросам промышленности"]
      - ["Межрегиональная", "Сеть партнёров", "Совместные мероприятия"]
- use: C13
  title: "Оригиналы ВИНК: трек, технологии, EXPO"
  thesis: "Группа ВИНК повторила международную задачу с рыночным фильтром и усилила технологическую повестку."
  rel: реестр
  table:
    header: ["Направление", "Суть", "Фильтр"]
    rows:
      - ["Международный трек", "Страны нужны стейкхолдерам", "Рыночный, не политический"]
      - ["Технологические запросы", "Заранее получать задачи заказчиков", "Готовность инвестировать"]
      - ["Развитие EXPO", "Самостоятельный проект", "Селекция подходящих экспонентов"]
- use: C13
  title: "Оригиналы Производители + Нефтесервис"
  thesis: "Более определённый предмет и собственная логика первых 100 дней."
  rel: реестр
  table:
    header: ["Направление", "Суть", "Первые шаги"]
    rows:
      - ["Производители", "Фокусные ниши", "Темы на пересечении спроса и предложения"]
      - ["Нефтесервис-08", "Сопровождение 51 клиента", "Исследование задач постоянных клиентов"]
      - ["Нефтесервис-09", "Новые форматы", "Пересборка по посещаемости"]
- use: A3
  title: "05. Образовательные и стейкхолдеры"
  text:
    label1: "ТНФ: трансформация и план развития"
- use: B4
  title: "Аналитическая проверка + Одна система"
  thesis: "Кооперация поставляет связи; работа со спросом — продукт; сопровождение делает результаты повторяемыми."
  rel: структура
  text:
    text1: "Два тематических индикатора допускают только приблизительное агрегирование."
    text2: "Остальные совпадения качественные: баллы относились к разным предметам оценки."
    text3: "Кооперация → работа со спросом → сопровождение: три звена одной системы."
    text4: "Не три автономных департамента, а одна логика ценности."
- use: B4
  title: "Стейкхолдеры: что можно начать без реформы"
  thesis: "Первые действия — использование уже имеющейся площадки, контактов и форматов."
  rel: перечень
  text:
    text1: "Международка: шесть разных инициатив, не увеличение флагов."
    text2: "Технологии: постановка задачи, подбор исполнителей, стандарт, доказательство эффекта."
    text3: "Инженерное сообщество: реальные предметные сообщества, не дополнительные доклады."
    text4: "Люди и образование: собственный проектный фокус и связь с задачами компаний."
- use: B4
  title: "Стейкхолдеры: выставка и общие точки"
  thesis: "Единодушие о ценности кооперации не означает согласия о масштабе, цене и форме."
  rel: контраст
  text:
    text1: "Выставка: коммерческие идеи на 2027 и долгосрочные региональные возможности."
    text2: "Новые ниши и инфраструктура — не утверждённая стратегия, а направления для проверки."
    text3: "Общие точки: все согласны, что отраслевая кооперация ценна."
    text4: "Разногласия: масштаб, цена, форма организации — предмет дальнейшей проработки."
- use: A3
  title: "06. Акценты Владимира"
  text:
    label1: "ТНФ: трансформация и план развития"
- use: B2
  title: "Владимир: почему TNF должен меняться"
  thesis: "TNF — совместное дело ключевых игроков. Коммерческий форум и отраслевая полезность не противоречат."
  rel: обоснование
  text:
    label1: "Совместное дело"
    text1: "TNF существует благодаря всей совокупности вовлечённых участников — не только организатору."
    label2: "Уникальная роль"
    text2: "Между государственным регламентом и коммерческой гибкостью."
    label3: "Позиционирование"
    text3: "Слово «институт развития» не решает задачу. Нужно коротко описать ценность и миссию."
    label4: "Приоритизация"
    text4: "Предложения многочисленны и местами противоречат — нельзя запускать всё."
- use: B4
  title: "Владимир: действия + Матрица бенчмарков"
  thesis: "В центре стратегического внимания — возвращаемость и удовлетворённость, отдельно от финансовой устойчивости."
  rel: обоснование
  text:
    text1: "Практические действия на ближайшие недели обозначены вместе с видением."
    text2: "Много управленческих показателей: NPS, возвращаемость, финансовая устойчивость."
    text3: "Бенчмарки — ориентир, не догма. Система должна отражать реальность TNF."
    text4: "Короткая миссия важнее длинного стратегического документа."
- use: A3
  title: "07. Предложения лидеров функций"
  text:
    label1: "ТНФ: трансформация и план развития"
- use: B2
  title: "Продажи + Маркетинг"
  thesis: "От отдельных продуктов — к развитию корпоративного клиента и качественной аудитории."
  rel: контраст
  text:
    label1: "Продажи (Артём)"
    text1: "Восстановить финансовую устойчивость через корпоративное ядро, продуктовую лестницу и сопровождение."
    label2: "Маркетинг (Надежда)"
    text2: "«Сколько пришло» недостаточно. Нужна возвращаемость и измеримость."
    label3: "Общий вывод"
    text3: "Продажи и маркетинг должны работать на одного корпоративного клиента, а не на отдельные транзакции."
    label4: ""
- use: B2
  title: "Программная дирекция + Исследователи"
  thesis: "Программа должна оставаться статусной и одновременно давать техническую полезность."
  rel: контраст
  text:
    label1: "Программа (дирекция)"
    text1: "Глубина, спрос и новые форматы — без механического расширения числа сессий."
    label2: "Исследователи"
    text2: "Главная формула — «хочу договариваться». Под ней разные задачи и горизонты."
    label3: "Связь"
    text3: "Программа строится на исследовании спроса, а не на угадывании."
    label4: ""
- use: A3
  title: "08. Продуктовые решения"
  text:
    label1: "ТНФ: трансформация и план развития"
- use: B2
  title: "Бейджи TNF-2027: ясная лестница ценности"
  thesis: "Дискуссия сместилась с цветов к вопросу: какую задачу решает более дорогой продукт?"
  rel: выбор
  text:
    label1: "Delegate Light"
    text1: "Порог 5000₽ — достаточно для принципиального спора. Противоречие между низким порогом и логикой апгрейда."
    label2: "Premium"
    text2: "Оплачивается не доклад, а управляемое деловое взаимодействие. Содержание усилено без обязательного выступления."
    label3: "Ясность"
    text3: "Клиент должен понимать, за что платит на каждом уровне."
    label4: ""
- use: B4
  title: "EXPO: концепция и три продукта застройки"
  thesis: "Не «больше стендов», а более живая отраслевая среда."
  rel: фокус
  text:
