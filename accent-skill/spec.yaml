deck:
  footer: TNF / Стратегическая сессия 20–22 ноября 2026
  font: Raleway
  mode: read
  palette:
    dark: '212121'
    text: '000000'
    accent: 2196F3
    highlight: E3F2FD
    surface: FAFAFA
    muted: '757575'
    rule: E0E0E0
