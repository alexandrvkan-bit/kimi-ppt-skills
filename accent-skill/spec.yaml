    text4: "Нефтесервис: сопровождение клиентов и новые форматы по обратной связи."
- use: B4
  title: "Корзина 05: Образовательные и стейкхолдеры"
  thesis: "Одна система из трёх звеньев: кооперация, спрос, сопровождение."
