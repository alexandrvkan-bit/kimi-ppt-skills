slides:
- use: A1
  title: 'ТНФ: трансформация и план развития'
  text:
    label1: Итоги стратегической сессии 20–22 ноября 2026
    meta1: Рабочая сборка v02
- use: A3
  title: 01. ТРАНСФОРМАЦИЯ И МИССИЯ
  text:
    label1: 'ТНФ: трансформация и план развития'
- use: C13
  title: 'Три перехода: каким TNF был — каким должен стать'
  thesis: 'TNF не отказывается от сильного ежегодного форума. Он добавляет к нему постоянную отраслевую работу, предметную полезность и управление отношениями с клиентами.'
- use: C13
  title: Три устойчивых представления о новой роли TNF
  thesis: 'В трёх днях возникали разные, совместимые между собой образы. Их нельзя считать тремя уже утверждёнными организационными формами.'
- use: B2
  title: Почему TNF необходимо пересобрать именно сейчас
  thesis: Причины трансформации одновременно отраслевые, клиентские и экономические; недостаточно просто «сделать форум больше».
  text:
    text1: 'Отраслевой запрос: государству, ВИНК, производителям и научной среде нужен механизм кооперации за пределами одного события.'
    text2: 'Стратегический актив: форум уже объединяет лидеров отрасли и обладает доверием, которое можно превратить в регулярную работу.'
    text3: 'Клиентский запрос: статус и хорошая организация признаны; не хватает профильных заказчиков, конкретных технологических решений и сопровождаемых встреч.'
    text4: 'Коммерческий вызов: сокращение дорогих бейджей, партнёрских пакетов и платных стендов при росте общей/бесплатной аудитории.'
- use: B1
  title: Миссия TNF на десять лет — редакционный проект
  thesis: 'Возможная миссия: «Соединять государство, заказчиков, производителей, научные и профессиональные сообщества, чтобы ускорять появление и внедрение решений для развития промышленно-энергетического комплекса».'
  text:
    text1: 'Обещание отрасли: превращать общие вызовы в подготовленные кооперационные проекты и проверяемые результаты.'
    text2: 'Обещание клиенту: давать доступ к нужным людям, содержанию и возможностям продолжить работу после форума.'
    text3: 'Обещание партнёрам: предоставлять нейтральную инфраструктуру взаимодействия без замены их полномочий и компетенций.'
    text4: 'Два горизонта: в 2027 году — коммерческая устойчивость и первые запуски; к условному 2030-му — доказать жизнеспособность круглогодичной модели; на горизонте десяти лет — стать устойчивой общеотраслевой площадкой.'
- use: F3
  title: '2027 → 2030 → десять лет: не перепутать горизонты и обязательства'
  thesis: Переход к круглогодичной платформе возможен, только если TNF сохраняет финансовую устойчивость основного форума и постепенно проверяет новые направления.
- use: C13
  title: 'Два контура ценности: без сцены нет аудитории, без аудитории нет сцены'
  thesis: 'Метафора театра помогает не противопоставлять статусную отраслевую повестку и платящую профессиональную аудиторию.'
- use: C13
  title: Восемь функций TNF в новой модели
  thesis: 'TNF может стать организатором взаимодействия, но не должен подменять государство, заказчика, отраслевой институт или исполнителя проекта.'
- use: C13
  title: Кто за что отвечает в модели круглогодичной платформы
  thesis: 'Предлагалось разделить стратегическое решение, подготовку совместных действий и организационное исполнение.'
- use: A3
  title: 02. КЛИЕНТСКИЕ ПОТРЕБНОСТИ И ГЭПЫ
  text:
    label1: 'ТНФ: трансформация и план развития'
- use: B4
  title: От четырёх клиентских сегментов — к трём крупным инициативам
  thesis: Сначала четыре команды сопоставили потребности и текущую полезность TNF, затем выбрали ограниченное число проблем для проработки первых 100 дней.
  text:
    text1: 'Сегменты работы: ВИНК, производители, нефтесервис, органы власти.'
    text2: Шкала 0–10 — субъективные оценки участников групп, не внешнее измерение NPS и не репрезентативные интервью.
    text3: Разрыв (гэп) рассчитан как 10 минус оценка группы, лишь для визуального ранжирования обсуждавшегося.
    text4: 'Повторяющиеся потребности: реальный заказчик, доступ к конкретному специалисту, технологическая/международная кооперация, релевантный формат, измеримый результат участия.'
- use: C13
  title: 'ВИНК: приоритет по величине разрыва'
  thesis: 'Самый большой разрыв группа увидела в международном опыте и прикладной инженерной повестке; первопричина — слабая известность конкретных задач закрытых заказчиков.'
- use: C13
  title: 'Производители: ценность есть, но профильных покупателей не хватает'
  thesis: 'В группе производителей самые большие недоработки относились к доступу к конкретным людям, а не к самой возможности выставить продукт.'
- use: C13
  title: 'Нефтесервис: главный разрыв — использование результата после форума'
  thesis: 'Группа нефтесервиса поставила высокие оценки приложению и встречам, но ниже оценила сохранение материалов и связку с научными задачами.'
- use: C13
  title: 'Власть: гэпы качественные, без выдуманных баллов'
  thesis: 'Группа власти намеренно выделила четыре задачи, а самым недоработанным направлением назвала кооперацию между странами, регионами и отраслями.'
- use: C13
  title: 'Повторяющиеся проблемы: общий смысл, разные оценки'
  thesis: 'Несколько групп указали на один системный вопрос — как привести нужных людей к нужной задаче. Но оценки 0–10 выставлялись РАЗНЫМ формулировкам, поэтому сопоставление тематическое, а не единый индекс.'
- use: C13
  title: Девять исходных инициатив и три итоговых направления
  thesis: 'В публичных защитах прозвучало 9 отдельных инициатив: 3 от власти, 3 от ВИНК, 1 от производителей и 2 от нефтесервиса. Финальное укрупнение в три направления произошло позднее и не отменяет исходные предложения.'
- use: A3
  title: 03. КАРТОЧКИ ТРЁХ ИНИЦИАТИВ
  text:
    label1: 'ТНФ: трансформация и план развития'
- use: H1
  title: 'Инициатива I · Кооперация (укрупнение 4 исходных линий)'
  thesis: 'Зачем: перевести статус TNF в предметные международные, межрегиональные и межотраслевые контакты, полезные участникам и отрасли.'
- use: H1
  title: 'Инициатива II · Технологический спрос и фокусные ниши'
  thesis: 'Зачем: выбирать темы и форматы TNF, опираясь на настоящие запросы заказчиков, наличие решений и готовность компаний инвестировать в участие.'
- use: H1
  title: 'Инициатива III · Сервисное сопровождение и развитие клиентов'
  thesis: 'Зачем: улучшить результативность участия ключевых корпоративных клиентов и их возвращаемость; собирать ценность не только в дни форума.'
- use: A3
  title: 04. СОБЫТИЯ И ФОРМАТЫ
  text:
    label1: 'ТНФ: трансформация и план развития'
- use: C13
  title: 'Первоисточник · Группы «Власть» и ВИНК: 6 инициатив'
  thesis: 'Каждую исходную инициативу важно показать отдельно: у них разные первые шаги, ресурсы и результаты. Защита групп ≠ утверждение руководства.'
- use: C13
  title: 'Первоисточник · Производители и нефтесервис: ещё 3 инициативы'
  thesis: 'Эти три предложения содержат более определённый предмет и собственную логику первых 100 дней. Их нельзя полностью заменить тремя общими направлениями.'
- use: C13
  title: 'Оригинал 01 · Власть: международная кооперация'
  thesis: 'Группа власти предложила использовать государственные каналы не ради формального присутствия, а ради роста числа содержательных иностранных делегаций и международных контактов.'
- use: C13
  title: 'Оригинал 02 · Власть: межотраслевая кооперация'
  thesis: 'Группа власти предложила использовать статус органов управления TNF для запуска межотраслевых рабочих форматов по запросам промышленности.'
- use: C13
  title: 'Оригинал 03 · Власть: межрегиональная кооперация'
  thesis: 'Группа власти предложила вместо разовых приглашений формировать сеть региональных партнёров и совместные мероприятия.'
- use: C13
  title: 'Оригинал 04 · ВИНК: международный трек'
  thesis: 'Группа ВИНК самостоятельно повторила международную задачу, но усилила её рыночным фильтром: страны должны быть нужны конкретным стейкхолдерам.'
- use: C13
  title: 'Оригинал 05 · ВИНК: технологические запросы и решения'
  thesis: 'Группа ВИНК предложила перестать угадывать потребности заказчиков, а заранее получать их технологические задачи и подбирать решения.'
- use: C13
  title: 'Оригинал 06 · ВИНК: развитие EXPO'
  thesis: 'Группа ВИНК выделила расширение EXPO в самостоятельный проект: важна не только площадь, но и селекция подходящих экспонентов.'
- use: C13
  title: 'Оригинал 07 · Производители: фокусные рыночные ниши'
  thesis: 'Группа производителей предложила выбирать темы форума не по инерции, а на пересечении спроса заказчиков и коммерчески перспективного предложения.'
- use: C13
  title: 'Оригинал 08 · Нефтесервис: сопровождение 51 клиента'
  thesis: 'Группа нефтесервиса предложила начать с исследования задач постоянных клиентов, а не с немедленного запуска готового института.'
- use: C13
  title: 'Оригинал 09 · Нефтесервис: новые форматы программы'
  thesis: 'Вторая самостоятельная инициатива группы нефтесервиса — пересобрать часть деловой программы, опираясь на посещаемость и обратную связь.'
- use: C13
  title: 'Аналитическая проверка: что можно усреднять, а что нет'
  thesis: 'Два тематических индикатора допускают только приблизительное агрегирование. Остальные совпадения — качественные: баллы относились к различным предметам оценки.'
- use: C13
  title: Одна система, а не три автономных департамента
  thesis: 'Кооперация поставляет нужные связи; работа со спросом превращает их в продукт TNF; сопровождение делает результаты повторяемыми.'
- use: C13
  title: 'Стейкхолдеры: что можно начать без большой реформы TNF'
  thesis: 'Первые действия из выступлений связаны с использованием уже имеющейся площадки, контактов и профессиональных форматов.'
- use: C13
  title: 'Стейкхолдеры: международка — шесть разных инициатив'
  thesis: 'Международное направление нельзя сводить к увеличению количества иностранных флагов: участники называли разные механики и целевые результаты.'
- use: C13
  title: 'Стейкхолдеры: технологические задачи, стандарты, данные'
  thesis: 'В технологическом блоке предложения дополняют друг друга: постановка задачи, подбор исполнителей, стандарт, доказательство эффекта.'
- use: C13
  title: 'Стейкхолдеры: инженерное сообщество и содержательная программа'
  thesis: 'Профессиональная глубина TNF должна строиться вокруг реальных предметных сообществ, а не дополнительных одинаковых докладов.'
- use: C13
  title: 'Стейкхолдеры: люди, образование и молодые инженеры'
  thesis: 'Предложения о кадрах требуют собственного проектного фокуса и связи с технологическими задачами компаний.'
- use: C13
  title: 'Стейкхолдеры: выставка, новые ниши и инфраструктура'
  thesis: 'Это не отдельная утверждённая стратегия расширения. В разговоре соседствовали коммерческие идеи на 2027 год и долгосрочные региональные возможности.'
- use: C13
  title: Общие точки совпадения и предметные разногласия стейкхолдеров
  thesis: 'Единодушие относительно ценности отраслевой кооперации не означает согласия о масштабе, цене и форме организации.'
- use: A3
  title: 05. АКЦЕНТЫ ВЛАДИМИРА
  text:
    label1: 'ТНФ: трансформация и план развития'
- use: B1
  title: 'Владимир: почему TNF должен меняться'
  thesis: Владимир видит TNF как совместное дело ключевых игроков отрасли. Коммерческий форум и отраслевая полезность не должны противоречить друг другу.
  text:
    text1: TNF существует благодаря всей совокупности вовлечённых государственных, корпоративных и экспертных участников — не только команде организатора.
    text2: Площадка находится между государственным регламентом и коммерческой гибкостью; это её уникальная роль.
    text3: Само по себе слово «институт развития» не решает задачу позиционирования. Нужно коротко описать ценность и миссию.
    text4: 'Предложения стейкхолдеров многочисленны и местами противоречат друг другу: нельзя запускать всё.'
- use: C13
  title: 'Владимир: конкретные действия и организационные запросы'
  thesis: 'Владимир обозначал не только видение, но и практические действия на ближайшие недели.'
- use: C13
  title: 'Матрица бенчмарков: какую систему нужно построить'
  thesis: Много управленческих показателей, но в центре стратегического внимания — возвращаемость и удовлетворённость, отдельно от финансовой устойчивости.
- use: A3
  title: 06. ПРЕДЛОЖЕНИЯ ЛИДЕРОВ ФУНКЦИЙ
  text:
    label1: 'ТНФ: трансформация и план развития'
- use: C13
  title: 'Продажи: от отдельных продуктов к развитию корпоративного клиента'
  thesis: 'В докладе Артёма центральная задача — восстановить финансовую устойчивость через корпоративное ядро, понятную продуктовую лестницу и сопровождение.'
- use: C13
  title: 'Маркетинг: качественная аудитория, возвращаемость и измеримость'
  thesis: 'Доклад Надежды показывает, почему «сколько людей пришло» недостаточно для оценки здоровья TNF.'
- use: C13
  title: 'Программная дирекция: глубина, спрос и новые форматы'
  thesis: 'Программа TNF должна оставаться статусной и одновременно давать техническую и инженерную полезность, без механического расширения числа сессий.'
- use: C13
  title: 'Исследователи: что клиенты называют реальной ценностью'
  thesis: 'Главная формула качественного исследования — «хочу договариваться». Но под ней скрываются разные задачи и горизонты.'
- use: A3
  title: 07. ПРОДУКТОВЫЕ РЕШЕНИЯ
  text:
    label1: 'ТНФ: трансформация и план развития'
- use: C13
  title: 'Бейджи TNF-2027: ясная лестница ценности'
  thesis: 'Дискуссия сместилась с цветов и зон доступа к вопросу: какую задачу клиент решает более дорогим продуктом?'
- use: C13
  title: 'Premium: оплачивается не доклад, а управляемое деловое взаимодействие'
  thesis: Итогом рабочего совещания стало усиление содержания Premium без обещания обязательного выступления с докладом.
- use: C13
  title: 'Delegate Light: пяти тысяч рублей оказалось достаточно для принципиального спора'
  thesis: 'У команды осталось противоречие между низким порогом входа, логикой апгрейда на Delegate и удобством регистрации.'
- use: B4
  title: 'EXPO: не «больше стендов», а более живая отраслевая среда'
  thesis: Владимир выступил за расширение выставки ради трафика, времени пребывания, встреч, демонстраций и интереса производителей — не ради площади самой по себе.
  text:
    text1: 'Базовый пространственный сценарий: один павильон около 4050 м² против примерно 2400 м² в предыдущем формате; отдельный малый пристрой, тематические зоны и возможный AI-павильон.'
    text2: Выставка должна содержать решения и оборудование, которые делают посещение полезным инженерам и заказчикам; тематическое зонирование требует проверки рынка.
    text3: Крупным компаниям — больше свободы индивидуальной застройки; малым производителям — доступный формат входа.
    text4: Выставка — место общения, демонстраций и рабочих активностей, а не однородная галерея стендов.
- use: C13
  title: 'EXPO: три продукта застройки и разные клиентские сегменты'
  thesis: 'Упрощение модели предлагает различать продаваемую площадь и услуги строительства, а не навязывать один дорогой комплект.'
- use: C13
  title: 'EXPO: экономика и цены — данные для проверки, не клиентский прайс'
  thesis: 'Владимир предложил уменьшать входной чек для малых компаний и компенсировать это масштабом, продуктовой дифференциацией и более дешёвым м² инфраструктуры.'
- use: C13
  title: 'EXPO: конкретные первые действия после сессии'
  thesis: 'В отличие от большинства концептуальных идей, здесь в финале 22 ноября озвучен близкий горизонт реализации.'
- use: A3
