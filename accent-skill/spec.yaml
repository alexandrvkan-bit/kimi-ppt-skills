    text4: "Единодушие о ценности кооперации; разногласия о масштабе, цене и форме."
- use: B4
  title: "Корзина 06: Акценты Владимира"
  thesis: "Совместное дело, уникальная роль, короткая миссия, приоритизация."
  rel: перечень
  text:
